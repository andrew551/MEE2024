[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the 127 MB triangle database or a network call; run with --runslow",
]
filterwarnings = [
    "ignore::DeprecationWarning:scipy.*",
]

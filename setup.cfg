[metadata]
name = mee2024
version = 1.4.0.dev0
author = Andrew Smith and Douglas Smith
description = Modern Eddington Experiment analysis pipeline

[options]
packages = find:
# 3.12, not the 3.9 declared until 2026-08-20. The floor is set by the dependencies, not by
# the language: numpy >= 2.5 and scipy >= 1.18 both require 3.12. Declaring 3.9 never made 3.9
# work -- pip accepted the install and silently resolved numpy and scipy back several years
# instead, which is how a collaborator's 3.10.7 machine reached a clean install and a failing
# suite with nothing to point at. A refused install is the better failure.
python_requires = >=3.12
include_package_data = true
install_requires =
    NumPy
    Astropy
    Photutils
    SciPy
    Matplotlib
    scikit-image
    astroquery==0.4.6
    FreeSimpleGUI
    OpenCV-python
    Pandas
    scikit-learn
    statsmodels
    platformdirs
    pywebview; sys_platform == "win32" or sys_platform == "darwin"


[options.extras_require]
dev =
    pytest
    pyflakes
# the new app window. Optional: without it, `mee2024 ui` falls back to the browser,
# serving exactly the same frontend from the same local server.
ui =
    pywebview

[options.package_data]
# resources/* alone does not reach into subdirectories, so the bundled Hipparcos
# catalogue and the star-label index need their own patterns
mee2024 =
    resources/*
    resources/hipparcos2/*
    resources/star_labels/*
    ui/frontend.html

[options.entry_points]
console_scripts =
    mee2024 = mee2024.main:main
